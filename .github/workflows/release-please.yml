name: Release Please

# Automates versioning the "boring" way: on every push to master, release-please
# reads the Conventional Commit messages since the last release and maintains a
# standing "release PR" that bumps package.json + the manifest and rewrites
# CHANGELOG.md. Merging that PR creates the git tag (vX.Y.Z) and the GitHub
# Release — which in turn triggers release.yml (verify + optional npm publish).
#
# So the human workflow is just: write conventional commits, merge the release
# PR when you want to ship. No more manual `npm version`.

on:
  push:
    branches: [master]

permissions:
  contents: write # create the release commit, tag, and GitHub Release
  pull-requests: write # open/update the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
