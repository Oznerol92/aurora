name: CI

# Runs on pushes to the long-lived branches and on every PR into them. CI
# installs deps, lints, checks formatting, runs the test suite, byte-compiles
# every source file (node --check), and smoke-tests the CLI's no-network paths
# across the supported Node range.
#
# Branch model: work branches → `pre-release` (your approval) → `release`
# (your approval). Both are protected and require these checks to be green.

on:
  push:
    branches: [release, pre-release]
  pull_request:
    branches: [release, pre-release]

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # better-sqlite3 is an optionalDependency; omitting it keeps CI fast and
      # avoids a native build that isn't needed to byte-check the JS.
      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Syntax-check all sources
        run: |
          set -euo pipefail
          find bin src -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "all sources parsed OK"

      - name: Smoke-test CLI (no network)
        run: |
          set -euo pipefail
          node bin/aurora.js --version
          node bin/aurora.js --help

      # Catch packaging mistakes (missing/extra files) before a release does.
      - name: Verify publish tarball
        run: npm pack --dry-run
