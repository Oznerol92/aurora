name: Release

# Fires when a version tag is pushed (e.g. v0.2.0). The release flow is:
#
#   npm version patch   # bumps package.json, commits, creates tag v0.x.y
#   git push --follow-tags
#
# This workflow then re-runs the CI checks and, if they pass, publishes a
# GitHub Release with auto-generated notes. It guards that the tag matches the
# version in package.json, so a mistyped tag fails loudly instead of shipping a
# mislabeled release. GitHub-only: no npm publish, no secrets beyond the
# built-in GITHUB_TOKEN.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Tag matches package.json version
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      - name: Syntax-check all sources
        run: |
          set -euo pipefail
          find bin src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Smoke-test CLI
        run: |
          set -euo pipefail
          node bin/aurora.js --version
          node bin/aurora.js --help

  release:
    name: github release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
