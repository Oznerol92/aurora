name: Release

# Runs AFTER a GitHub Release is published. release-please (see
# release-please.yml) owns the version bump, CHANGELOG, tag, and the Release
# itself; this workflow's job is to verify the released tag and publish to npm.
#
# Triggering on `release: published` (instead of the raw tag push) means this
# only fires for real, release-please-created releases — not for any stray tag.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Tag matches package.json version
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::release tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      - name: Syntax-check all sources
        run: |
          set -euo pipefail
          find bin src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Smoke-test CLI
        run: |
          set -euo pipefail
          node bin/aurora.js --version
          node bin/aurora.js --help

  npm-publish:
    name: npm publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      # No-ops cleanly when NPM_TOKEN isn't configured, so the GitHub Release
      # still ships. To start publishing to npm, add an NPM_TOKEN repo secret
      # (an npm automation token) — nothing else needs to change.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set — skipping npm publish (GitHub Release still created)."
            exit 0
          fi
          npm publish --provenance --access public
